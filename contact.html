<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <meta
      name="description"
      content="Contact Mattias Nilsson, UX Designer & Engineer."
    />
    <meta name="author" content="Mattias Nilsson" />
    <title>Mattias Nilsson > Contact</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&amp;display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="favicon.ico" type="image/x-icon" />
    <meta name="theme-color" content="aliceblue" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#070a0e" media="(prefers-color-scheme: dark)" />
    <meta
      name="contact-api-url"
      content="https://portfolio-contact-api-hfwe.onrender.com"
    />
    <link rel="stylesheet" href="resetStyles.css" />
    <link rel="stylesheet" href="index.css" />
    <script defer src="contact-form.js"></script>
  </head>
  <body class="contact-page">
    <main class="contact-page-main">
      <a
        href="index.html#about"
        class="interests-lightbox-close contact-button"
        aria-label="Close"
      >
        <span class="interests-lightbox-close-icon" aria-hidden="true"></span>
      </a>
      <section id="contact-form-panel" class="contact-page-section">
        <h1 id="contact-page-title">Contact</h1>
        <form id="contact-form" class="contact-form" novalidate>
          <div class="contact-form-field">
            <label for="contact-name">Name</label>
            <input
              id="contact-name"
              name="name"
              type="text"
              autocomplete="name"
              required
              maxlength="120"
            />
          </div>
          <div class="contact-form-field">
            <label for="contact-email-input">Email address</label>
            <input
              id="contact-email-input"
              name="email"
              type="email"
              autocomplete="email"
              inputmode="email"
              required
              maxlength="254"
            />
          </div>
          <div class="contact-form-field">
            <label for="contact-message">Message</label>
            <textarea
              id="contact-message"
              name="message"
              rows="8"
              required
              maxlength="5000"
            ></textarea>
          </div>
          <p
            id="contact-form-status"
            class="contact-form-status"
            role="status"
            aria-live="polite"
            hidden
          ></p>
          <button type="submit" class="contact-button contact-form-submit">
            Send<span class="svg-icon-mask" style="--svg-icon-src: url('public/icons/send.svg')" aria-hidden="true"></span><img class="svg-icon-image-fallback" src="public/icons/send.svg" alt="" />
          </button>
        </form>
      </section>
      <section
        id="contact-success-panel"
        class="contact-page-section contact-page-section--success"
        hidden
      >
        <div class="contact-success-content">
          <img
            class="contact-success-animation"
            src="public/icons/send-success.svg"
            alt=""
            width="96"
            height="96"
          />
          <h2 id="contact-success-title">Message sent</h2>
          <p class="contact-success-message">
            Thanks for reaching out. I’ll get back to you soon.
          </p>
        </div>
      </section>
    </main>
  </body>
</html>
