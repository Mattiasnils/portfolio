# Render Blueprint — deploy from Dashboard: New > Blueprint > connect repo
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: portfolio-contact-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: CONTACT_TO
        value: mattiasnils@outlook.com
      - key: CONTACT_FROM
        value: onboarding@resend.dev
      - key: ALLOWED_ORIGINS
        value: https://mattiasnils.github.io
      - key: RESEND_API_KEY
        sync: false
