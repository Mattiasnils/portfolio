<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <meta
      property="og:image"
      content="https://mattiasnils.github.io/portfolio/public/img/ziklobank-thumbnail.webp"
    />
    <title>Mattias Nilsson > Ziklo Bank</title>
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#070a0e" />
    <script>
      (function () {
        var path = location.pathname;
        var marker = "/portfolio/";
        var portfolioRoot;

        if (path.indexOf(marker) !== -1) {
          portfolioRoot = path.slice(0, path.indexOf(marker) + marker.length);
        } else {
          var nestedMatch = path.match(/^(.*)\/(projects|blog)\//);
          portfolioRoot = nestedMatch ? nestedMatch[1] + "/" : "/";
        }

        if (portfolioRoot.charAt(0) !== "/") {
          portfolioRoot = "/" + portfolioRoot;
        }

        var base = document.createElement("base");
        base.href = location.origin + portfolioRoot;
        document.head.appendChild(base);
      })();
    </script>
    <link rel="stylesheet" href="resetStyles.css" />
    <link rel="stylesheet" href="index.css" />
    <link rel="stylesheet" href="projects/ziklobank/ziklobank.css" />
    <link rel="icon" href="favicon.ico" type="image/x-icon" />
    <script src="nav-boot.js"></script>
    <script defer src="animateOnScroll.js?v=8"></script>
    <script>
      (function (h, o, t, j, a, r) {
        h.hj =
          h.hj ||
          function () {
            (h.hj.q = h.hj.q || []).push(arguments);
          };
        h._hjSettings = { hjid: 3794888, hjsv: 6 };
        a = o.getElementsByTagName("head")[0];
        r = o.createElement("script");
        r.async = 1;
        r.src = t + h._hjSettings.hjid + j + h._hjSettings.hjsv;
        a.appendChild(r);
      })(window, document, "https://static.hotjar.com/c/hotjar-", ".js?sv=");
    </script>
  </head>
  <body>
    <header data-nav-mount data-mega-nav data-nav-backdrop="dark"></header>
    <main>
      <div class="project-intro">
        <div class="headline animate-pop-up">
          <h1>Ziklo Bank</h1>
          <h2>Redesign of the mobile banking app</h2>
        </div>
        <img
          id="hero"
          src="public/img/ziklobank-thumbnail.webp"
          alt="Ziklo Bank card, mobile app, and watch experience"
          class="r"
        />
        <div class="project-summary">
          <h3>Summary</h3>
          <p>
            Redesign of Ziklo Bank’s mobile banking experience — spanning the
            core app and adjacent card and wearable surfaces.
          </p>
        </div>
      </div>
      <span class="divider"></span>
      <p class="coming-soon">Coming soon<span class="coming-soon-ellipsis" aria-hidden="true">...</span></p>
    </main>
  </body>
</html>
